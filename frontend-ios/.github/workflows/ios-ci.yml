name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
    
    - name: Cache derived data
      uses: actions/cache@v3
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-
    
    - name: Install dependencies (if using CocoaPods)
      run: |
        if [ -f "Podfile" ]; then
          pod install
        fi
    
    - name: Install dependencies (if using Swift Package Manager)
      run: |
        if [ -f "Package.swift" ]; then
          swift package resolve
        fi
    
    - name: Build and Test
      run: |
        xcodebuild clean build test \
          -project onykroua.xcodeproj \
          -scheme onykroua \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -enableCodeCoverage YES \
          -derivedDataPath DerivedData | xcpretty
    
    - name: Generate Code Coverage Report
      run: |
        xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.json
        flags: unittests
        name: ios-coverage
    
    - name: Run SwiftLint
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint
        else
          echo "SwiftLint not installed, skipping"
        fi
    
    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-artifacts
        path: |
          DerivedData/Build/Logs/*.log
          DerivedData/Build/Products/Debug-iphonesimulator/*.app
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  performance-test:
    runs-on: macos-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
    
    - name: Build for Performance Testing
      run: |
        xcodebuild build \
          -project onykroua.xcodeproj \
          -scheme onykroua \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -derivedDataPath PerformanceDerivedData | xcpretty
    
    - name: Measure App Size
      run: |
        find PerformanceDerivedData/Build/Products/Release-iphonesimulator -name "*.app" -exec du -sh {} \;
    
    - name: Check Binary Size
      run: |
        APP_SIZE=$(find PerformanceDerivedData/Build/Products/Release-iphonesimulator -name "onykroua.app" -exec du -sm {} \; | awk '{print $1}')
        echo "App size: ${APP_SIZE}MB"
        if [ $APP_SIZE -gt 50 ]; then
          echo "⚠️ Warning: App size is larger than expected (${APP_SIZE}MB)"
        else
          echo "✅ App size is acceptable (${APP_SIZE}MB)"
        fi

  deploy-staging:
    runs-on: macos-latest
    needs: [test, security-scan, performance-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
    
    - name: Build Archive
      run: |
        xcodebuild archive \
          -project onykroua.xcodeproj \
          -scheme onykroua \
          -configuration Release \
          -archivePath onykroua.xcarchive \
          -destination 'generic/platform=iOS' | xcpretty
    
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath onykroua.xcarchive \
          -exportPath . \
          -exportOptionsPlist ExportOptions.plist | xcpretty
    
    - name: Upload to TestFlight (if configured)
      if: env.APPLE_ID != ''
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file onykroua.ipa \
          --username "$APPLE_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD" \
          --asc-provider "$APPLE_TEAM_ID" \
          --verbose

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test]
    if: always()
    
    steps:
    - name: Notify on Success
      if: needs.test.result == 'success' && needs.security-scan.result == 'success' && needs.performance-test.result == 'success'
      run: |
        echo "✅ All checks passed! iOS app is ready for deployment."
        echo "📊 Test coverage: Available in Codecov"
        echo "🔒 Security scan: Available in Security tab"
        echo "📈 Performance: App size within limits"
    
    - name: Notify on Failure
      if: needs.test.result == 'failure' || needs.security-scan.result == 'failure' || needs.performance-test.result == 'failure'
      run: |
        echo "❌ Some checks failed. Please review the logs:"
        echo "🧪 Tests: ${{ needs.test.result }}"
        echo "🔒 Security: ${{ needs.security-scan.result }}"
        echo "📈 Performance: ${{ needs.performance-test.result }}"
